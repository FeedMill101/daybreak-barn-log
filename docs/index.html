<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#304251">
<title>Daybreak Barn Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Daybreak Barn Log. Layout idea: one thumb-reachable column of entry cards on a phone,
   the same cards in a grid with a side rail on tablet and desktop; print shows the report only. */
:root {
  color-scheme: light;
  --slate: #304251;      /* brand header and ink */
  --orange: #ff8f00;     /* brand accent: actions */
  --orange-ink: #a85a00; /* accent as text on white */
  --teal: #007a9c;       /* brand secondary: links, chart series 1 */
  --amber: #d97706;      /* chart series 2 */
  --bg: #f3f1ec; --card: #ffffff; --line: #ded9cf; --ink: #22303b; --mute: #65717c;
  --good: #1f7a44; --good-bg: #e2f3e8; --warn: #9a5b00; --warn-bg: #fff1d6; --bad: #b3261e; --bad-bg: #fde4e1;
  --display: "Quicksand", "Trebuchet MS", "Segoe UI", sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r: 12px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.4 var(--body); -webkit-text-size-adjust: 100%; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; color: var(--slate); }
h1 { font-size: 1.35rem; } h2 { font-size: 1.1rem; } h3 { font-size: .95rem; }
a { color: var(--teal); }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.num, td.n, th.n { font-variant-numeric: tabular-nums; }

#top { background: var(--slate); color: #fff; display: flex; align-items: center; gap: 10px; padding: 8px 14px; position: sticky; top: 0; z-index: 20; }
#top img { height: 34px; width: auto; display: block; }
#top .ttl { font-family: var(--display); font-weight: 700; font-size: 1rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#sync { border: 0; border-radius: 999px; padding: 5px 10px; font-size: .78rem; font-weight: 600; background: #ffffff22; color: #fff; white-space: nowrap; }
#sync.pend { background: var(--orange); color: #2b1a00; } #sync.off { background: #ffffff22; } #sync.err { background: var(--bad); }
#who { border: 2px solid var(--orange); background: transparent; color: #fff; border-radius: 999px; min-width: 44px; height: 36px; padding: 0 10px; font-weight: 700; }

#nav { display: flex; background: var(--card); border-top: 1px solid var(--line); position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; padding-bottom: env(safe-area-inset-bottom, 0); }
#nav a { flex: 1; text-align: center; padding: 9px 2px 8px; text-decoration: none; color: var(--mute); font-size: .74rem; font-weight: 600; border-top: 3px solid transparent; }
#nav a b { display: block; font-family: var(--display); font-size: 1.05rem; line-height: 1.1; color: inherit; }
#nav a.on { color: var(--slate); border-top-color: var(--orange); }
main { padding: 14px 16px 92px; max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 900px) {
  #nav { top: 50px; bottom: 0; right: auto; width: 96px; flex-direction: column; border-top: 0; border-right: 1px solid var(--line); justify-content: flex-start; }
  #nav a { flex: 0 0 auto; padding: 14px 4px; border-top: 0; border-left: 4px solid transparent; }
  #nav a.on { border-left-color: var(--orange); }
  main { margin-left: 96px; padding: 20px 28px 40px; max-width: 1280px; }
}

.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bar .grow { flex: 1; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--card); color: var(--slate); border-radius: 10px; padding: 9px 14px; font-weight: 600; min-height: 44px; }
.btn.pri { background: var(--orange); border-color: var(--orange); color: #2b1a00; }
.btn.sm { min-height: 36px; padding: 5px 10px; font-size: .86rem; }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .5; }
.datebar { display: flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 6px; }
.datebar .d { flex: 1; text-align: center; font-family: var(--display); font-weight: 700; color: var(--slate); }
.datebar .d small { display: block; font: 600 .74rem var(--body); color: var(--mute); }
.past { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: .9rem; }
.note { color: var(--mute); font-size: .86rem; }
.banner { border-radius: 10px; padding: 10px 12px; font-size: .9rem; background: var(--warn-bg); color: var(--warn); }
.banner.bad { background: var(--bad-bg); color: var(--bad); }

.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
@media (min-width: 800px) { .grid.wide { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card > .hd { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.card > .hd .sub { color: var(--mute); font-size: .84rem; margin-left: auto; }
a.card { text-decoration: none; color: inherit; }
a.card:hover { border-color: var(--teal); }
.card.empty { background: transparent; border-style: dashed; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border-radius: 999px; padding: 3px 9px; font-size: .78rem; font-weight: 700; background: #eceae4; color: var(--mute); white-space: nowrap; }
.chip.ok { background: var(--good-bg); color: var(--good); } .chip.part { background: var(--warn-bg); color: var(--warn); } .chip.bad { background: var(--bad-bg); color: var(--bad); }
.stripe { border-left: 5px solid var(--line); } .stripe.ok { border-left-color: var(--good); } .stripe.part { border-left-color: var(--orange); } .stripe.bad { border-left-color: var(--bad); }

.f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.f > label, .lbl { font-size: .78rem; font-weight: 700; color: var(--mute); text-transform: uppercase; letter-spacing: .03em; }
.in { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px; font: inherit; font-size: 1.05rem; background: #fff; color: var(--ink); min-height: 46px; }
.in.num { font-variant-numeric: tabular-nums; }
.in:focus { border-color: var(--teal); outline: none; box-shadow: 0 0 0 3px #007a9c33; }
.in.bad { border-color: var(--bad); background: var(--bad-bg); }
.in.big { font-size: 1.5rem; font-weight: 700; letter-spacing: .02em; }
textarea.in { min-height: 46px; resize: vertical; }
.row { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); align-items: end; }
.row4 { display: grid; gap: 6px; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: end; }
.seg { display: flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
.seg button { flex: 1; border: 0; background: transparent; padding: 10px 4px; min-height: 44px; font-weight: 600; font-size: .88rem; color: var(--mute); border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button.on { background: var(--slate); color: #fff; }
.seg button.on.g { background: var(--good); } .seg button.on.w { background: var(--orange); color: #2b1a00; } .seg button.on.b { background: var(--bad); }
.tog { border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 12px; min-height: 44px; font-weight: 600; font-size: .9rem; color: var(--ink); text-align: left; display: flex; gap: 8px; align-items: center; }
.tog i { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--line); flex: 0 0 auto; display: inline-block; }
.tog.on { border-color: var(--good); background: var(--good-bg); } .tog.on i { background: var(--good); border-color: var(--good); }
.calc { background: #eef6f8; border-radius: 10px; padding: 8px 10px; font-size: .9rem; color: var(--slate); display: flex; gap: 6px 14px; flex-wrap: wrap; }
.calc b { font-variant-numeric: tabular-nums; }
.msg { border-radius: 10px; padding: 8px 10px; font-size: .88rem; font-weight: 600; } .msg.warn { background: var(--warn-bg); color: var(--warn); } .msg.bad { background: var(--bad-bg); color: var(--bad); }
.done { color: var(--good); font-weight: 700; font-size: .84rem; }
details > summary { cursor: pointer; font-weight: 700; color: var(--slate); font-family: var(--display); }

.tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.tile .v { font-family: var(--display); font-weight: 700; font-size: 1.6rem; color: var(--slate); font-variant-numeric: tabular-nums; line-height: 1.15; }
.tile .k { font-size: .78rem; font-weight: 700; color: var(--mute); text-transform: uppercase; letter-spacing: .03em; }
.tile .s { font-size: .8rem; color: var(--mute); }
.scope { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.scope button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 13px; font-weight: 600; color: var(--slate); min-height: 38px; }
.scope button.on { background: var(--slate); color: #fff; border-color: var(--slate); }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .tip { position: absolute; top: 0; pointer-events: none; background: var(--slate); color: #fff; border-radius: 8px; padding: 5px 8px; font-size: .78rem; white-space: nowrap; transform: translateX(-50%); display: none; z-index: 2; }
.legend { display: flex; gap: 12px; font-size: .8rem; color: var(--mute); flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }

.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .86rem; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font-size: .74rem; text-transform: uppercase; letter-spacing: .03em; color: var(--mute); background: #faf8f4; }
td.n, th.n { text-align: right; }
tr.tot td { font-weight: 700; border-top: 2px solid var(--slate); }
td.flag { color: var(--bad); font-weight: 700; }
td.wrap { white-space: normal; min-width: 160px; }

#modal { position: fixed; inset: 0; background: #1b2630aa; z-index: 50; display: none; align-items: flex-end; justify-content: center; }
#modal.on { display: flex; }
#modal .sheet { background: var(--card); border-radius: 16px 16px 0 0; padding: 18px 16px 24px; width: 100%; max-width: 520px; max-height: 88%; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
@media (min-width: 600px) { #modal { align-items: center; } #modal .sheet { border-radius: 16px; } }
.who { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
.who button { min-height: 56px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; font-family: var(--display); font-weight: 700; font-size: 1.15rem; color: var(--slate); }
.who button.on { background: var(--slate); color: #fff; border-color: var(--slate); }
.thumb { max-width: 120px; max-height: 90px; border-radius: 8px; border: 1px solid var(--line); }
.rpt-head { display: flex; align-items: center; gap: 14px; border-bottom: 3px solid var(--orange); padding-bottom: 10px; }
.rpt-head .logo { background: var(--slate); border-radius: 8px; padding: 6px 10px; } .rpt-head img { height: 34px; display: block; }
.rpt h2 { margin-top: 14px; margin-bottom: 4px; }
.rpt .sig { display: flex; gap: 30px; margin-top: 26px; font-size: .86rem; } .rpt .sig span { flex: 1; border-top: 1px solid var(--ink); padding-top: 4px; }
@media (prefers-reduced-motion: no-preference) { .btn, .seg button, .tog { transition: background-color .12s, border-color .12s; } }
@media print {
  @page { size: letter landscape; margin: 10mm; }
  body { background: #fff; font-size: 10pt; }
  #top, #nav, .noprint { display: none !important; }
  main { margin: 0; padding: 0; max-width: none; }
  .card { border: 0; padding: 0; }
  .tw { overflow: visible; }
  table { font-size: 8.6pt; } th, td { padding: 3px 5px; }
  .rpt-head .logo { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .rpt h2 { break-after: avoid; } tr { break-inside: avoid; } .pb { break-before: page; }
}

</style>
</head>
<body>
<header id="top">
  <img id="logo" alt="Daybreak Farms" width="97" height="34">
  <div class="ttl">Barn Log</div>
  <button id="sync" type="button" class="off" title="Sync status">Starting...</button>
  <button id="who" type="button" title="Who is entering">Who?</button>
</header>
<main id="main"><p class="note">Loading the barn log...</p></main>
<nav id="nav" aria-label="Sections"></nav>
<div id="modal"></div>
